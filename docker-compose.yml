services:
  postgres:
    image: postgres:16
    # pg_stat_statements: guarda estadísticas de CADA consulta (llamadas, tiempo total); alimenta el endpoint
    # /diagnostics/slow-queries. log_lock_waits: Postgres registra en su log toda espera de bloqueo > 1s,
    # con las consultas de ambos lados (así queda evidencia de un bloqueo aunque nadie lo estuviera mirando).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "log_lock_waits=on"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartbancs}
      POSTGRES_USER: ${POSTGRES_USER:-smartbancs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbancs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # POR QUÉ montar los .sql aquí: la imagen oficial ejecuta en orden alfabético todo lo
      # que haya en este directorio, SOLO la primera vez (volumen vacío). Así el esquema y
      # el seed se crean solos con `docker compose up`, sin pasos manuales.
      # POR QUÉ un montaje por archivo: el entrypoint NO recorre subdirectorios, así que
      # montar las carpetas ddl/ y dml/ enteras dejaría los scripts sin ejecutar (error real
      # que encontramos al verificar). El prefijo numérico (01,02,03) fija el orden.
      - ./database/ddl/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/ddl/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/dml/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - ./database/ddl/04_analytics.sql:/docker-entrypoint-initdb.d/04_analytics.sql:ro
      - ./database/ddl/05_diagnostics.sql:/docker-entrypoint-initdb.d/05_diagnostics.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # POR QUÉ healthcheck: sin él, depends_on solo espera a que el contenedor ARRANQUE,
      # no a que Postgres acepte conexiones, y la API fallaría en su primer intento.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbancs} -d ${POSTGRES_DB:-smartbancs}"]
      interval: 5s
      timeout: 3s
      retries: 10

  transaction-api:
    build: ./services/transaction-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://smartbancs:smartbancs@postgres:5432/smartbancs}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # SIN depends_on hacia ai-service a propósito: la API debe arrancar y funcionar con la IA caída.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_NOTIFY_IN_PROCESS: ${AI_NOTIFY_IN_PROCESS:-false}
      BANCS_URL: ${BANCS_URL:-http://bancs-mock:8002}
      # Vacío = trazas generadas pero no exportadas (no hay colector en el compose por defecto).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # POR QUÉ: el servicio de pruebas (y cualquier consumidor) debe esperar a que la API
      # RESPONDA, no solo a que el contenedor haya arrancado. Usa /health (liveness, sin BD).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15

  ai-service:
    build: ./services/ai-service
    environment:
      AI_SIMULATED_LATENCY_MS: ${AI_SIMULATED_LATENCY_MS:-300-800}
      AI_FAILURE_RATE: ${AI_FAILURE_RATE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${AI_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Worker del outbox: MISMA imagen que la API, otro comando. Proceso separado => si se cae o se
  # satura, las transferencias no se enteran; y se puede escalar a N réplicas (SKIP LOCKED).
  outbox-worker:
    build: ./services/transaction-api
    command: ["python", "-m", "app.workers.outbox_worker"]
    environment:
      SERVICE_NAME: outbox-worker
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://smartbancs:smartbancs@postgres:5432/smartbancs}
      # Pool pequeño: el worker hace consultas cortas; no debe quitarle conexiones a la API.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: 5
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      BANCS_URL: ${BANCS_URL:-http://bancs-mock:8002}
    depends_on:
      postgres:
        condition: service_healthy

  # Core legado simulado: lento (200-500ms) y se satura por encima de BANCS_MAX_CONCURRENT peticiones.
  bancs-mock:
    build: ./services/bancs-mock
    environment:
      BANCS_LATENCY_MS: ${BANCS_LATENCY_MS:-200-500}
      BANCS_MAX_CONCURRENT: ${BANCS_MAX_CONCURRENT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BANCS_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Pipeline ETL (Fase 6). `profiles: [etl]` => no arranca con `docker compose up`; se lanza con `make etl`.
  etl:
    build: ./etl
    profiles: ["etl"]
    environment:
      DATABASE_DSN: postgresql://${POSTGRES_USER:-smartbancs}:${POSTGRES_PASSWORD:-smartbancs}@postgres:5432/${POSTGRES_DB:-smartbancs}
    volumes:
      - ./etl:/etl
      - ./database:/database:ro
      - ./evidence:/evidence
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/prometheus/alerts_test.yml:/etc/prometheus/alerts_test.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - transaction-api

  # Ejecutor de pruebas. `profiles: [test]` => NO arranca con `docker compose up`; solo cuando se
  # pide explícitamente. POR QUÉ en contenedor: las pruebas corren dentro de la red de Compose
  # (mismos nombres de host que la API) y no exigen instalar Python ni dependencias en la máquina.
  tests:
    build: ./tests
    profiles: ["test"]
    environment:
      API_URL: http://transaction-api:8000
      DATABASE_DSN: postgresql://${POSTGRES_USER:-smartbancs}:${POSTGRES_PASSWORD:-smartbancs}@postgres:5432/${POSTGRES_DB:-smartbancs}
      EVIDENCE_DIR: /evidence/test-data
      EVIDENCE_AI_DIR: /evidence/ai-resilience
      EVIDENCE_BANCS_DIR: /evidence/bancs
      EVIDENCE_INCIDENT_DIR: /evidence/incident
      EVIDENCE_LOAD_DIR: /evidence/load-test-results
      PROMETHEUS_URL: http://prometheus:9090
      BANCS_URL: http://bancs-mock:8002
      # Permite a los tests unitarios importar módulos PUROS de la API (p. ej. el circuit breaker).
      PYTHONPATH: /srv
    volumes:
      - ./tests:/tests
      - ./evidence:/evidence
      - ./services/transaction-api/app:/srv/app:ro
    depends_on:
      transaction-api:
        condition: service_healthy

volumes:
  pgdata:
